<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mycompany · Ofis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #0b0806; --panel: #120d09; --panel2: #18110b; --line: #3a2a19; --line2: #5a4024;
    --text: #e9dcc3; --muted: #9c8a6c; --dim: #6d5e47;
    --accent: #f0a63a; --ok: #3fd47a; --bad: #ef5a4c; --warn: #f2c94c; --violet: #a77bf3;
    --pixel: "Pixelify Sans", "Silkscreen", ui-monospace, monospace;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--mono); }
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }
  button { font: inherit; cursor: pointer; }

  header { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px 8px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font: 700 22px var(--pixel); color: var(--text); letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header .bar { height: 3px; flex: 0 0 160px; background: var(--line); border-radius: 2px; align-self: center; overflow: hidden; }
  header .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s; }
  header .meta { color: var(--muted); margin-left: auto; white-space: nowrap; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0; min-height: 0; }
  #harita { position: relative; margin: 14px; border: 2px solid var(--line2); border-radius: 18px;
            box-shadow: inset 0 0 0 6px #0e0a07, inset 0 0 0 8px var(--line); background: #070504; min-height: 420px; overflow: hidden; }
  #sahne { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #mesai { position: absolute; left: 18px; top: 14px; font: 600 11px var(--mono); color: var(--warn);
           background: #1a1206e0; border: 1px solid #6a4c12; padding: 4px 8px; border-radius: 6px; display: none; }

  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; min-height: 0; padding: 14px 16px 30px; }
  aside h2 { font: 700 17px var(--pixel); margin: 18px 0 8px; color: var(--text); }
  aside h2:first-child { margin-top: 2px; }
  aside h2 small { font: 400 11px var(--mono); color: var(--muted); margin-left: 6px; }
  .kart { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .kart h3 { margin: 0 0 4px; font: 700 16px var(--pixel); }
  .kart p { margin: 4px 0; }
  .kucuk { color: var(--muted); font-size: 11.5px; }
  code, .yol { font: 11.5px var(--mono); color: #c9b3f2; word-break: break-all; }
  .dugmeler { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .d { border: 0; border-radius: 4px; padding: 7px 12px; font: 700 14px var(--pixel); color: #08140c; box-shadow: 0 3px 0 #0006; }
  .d:active { transform: translateY(2px); box-shadow: 0 1px 0 #0006; }
  .d.yesil { background: var(--ok); } .d.kirmizi { background: var(--bad); color: #1a0705; }
  .d.mor { background: var(--violet); color: #12071f; } .d.sari { background: var(--warn); color: #1c1503; }
  .d.koyu { background: #2a1f14; color: var(--text); border: 1px solid var(--line2); }
  .d[disabled] { opacity: .45; cursor: default; }
  .cip { display: inline-block; padding: 1px 7px; border-radius: 9px; font: 600 10.5px var(--mono); }
  .c-running { background: #123d22; color: #6ff0a0; } .c-waiting { background: #3d3109; color: var(--warn); }
  .c-error { background: #45120d; color: #ff8d80; } .c-paused { background: #24201a; color: var(--muted); }
  .c-idle { background: #1e1912; color: var(--muted); }
  .liste { list-style: none; margin: 6px 0 0; padding: 0; }
  .liste li { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; padding: 5px 0; border-top: 1px dashed #2c2116; align-items: baseline; }
  .liste li:first-child { border-top: 0; }
  .liste li.tik { cursor: pointer; } .liste li.tik:hover { background: #1f170e; }
  details > summary { cursor: pointer; list-style: none; font: 700 17px var(--pixel); margin: 18px 0 8px; }
  details > summary::before { content: "▸ "; color: var(--accent); }
  details[open] > summary::before { content: "▾ "; }
  textarea { width: 100%; min-height: 54px; resize: vertical; background: #0d0907; color: var(--text); border: 1px solid var(--line2);
             border-radius: 6px; padding: 7px 8px; font: 12px var(--mono); }
  .ozet b { color: var(--accent); font-weight: 600; }
  .bos { color: var(--dim); font-style: italic; }

  footer { display: grid; grid-template-columns: auto auto auto 1fr; gap: 26px; align-items: center; padding: 8px 18px 12px; border-top: 1px solid var(--line); }
  footer .grup { display: flex; flex-direction: column; gap: 4px; }
  footer .grup > span { font: 600 10px var(--mono); letter-spacing: 3px; color: var(--dim); }
  footer .sira { display: flex; gap: 10px; align-items: center; }
  .isik { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #3a2c1d; display: grid; place-items: center; background: #0d0907; }
  .isik i { width: 10px; height: 10px; border-radius: 50%; background: #333; box-shadow: none; }
  .isik.on i { background: var(--renk); box-shadow: 0 0 10px var(--renk); }
  .renk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #2a2017; cursor: pointer; }
  .renk.secili { outline: 2px solid var(--text); outline-offset: 2px; }
  footer .k { background: #1a130c; border: 1px solid var(--line2); color: var(--text); border-radius: 6px; padding: 5px 10px; font: 600 11.5px var(--mono); }
  footer .durum { text-align: right; color: var(--muted); font-size: 11.5px; }

  #modal { position: fixed; inset: 0; background: #000b; display: none; place-items: center; z-index: 10; padding: 20px; }
  #modal .ic { background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; width: min(820px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
  #modal .bas { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font: 700 16px var(--pixel); }
  #modal pre { margin: 0; padding: 14px 16px; overflow: auto; white-space: pre-wrap; font: 12px/1.5 var(--mono); color: var(--text); }
  #tost { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #1d150c; border: 1px solid var(--accent);
          color: var(--text); padding: 8px 14px; border-radius: 8px; display: none; z-index: 11; }

  @media (max-width: 900px) {
    html, body { height: auto; }
    body { display: block; }
    main { grid-template-columns: 1fr; }
    aside { overflow: visible; }
    #harita { height: 62vh; margin: 10px; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    footer { grid-template-columns: 1fr; gap: 10px; }
    footer .durum { text-align: left; }
    header .bar { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1 id="ad">my<span>company</span></h1>
  <div class="bar" title="bugünkü harcama / günlük tavan"><i id="para-bar"></i></div>
  <div class="meta" id="ust-meta">bağlanıyor…</div>
</header>
<main>
  <section id="harita" aria-label="Ofis haritası">
    <canvas id="sahne"></canvas>
    <div id="mesai"></div>
  </section>
  <aside id="panel"></aside>
</main>
<footer>
  <div class="grup"><span>GÜÇ</span>
    <div class="sira">
      <div class="isik" id="i-sunucu" title="ofis sunucusu" style="--renk:var(--ok)"><i></i></div>
      <div class="isik" id="i-mesai" title="mesai" style="--renk:var(--accent)"><i></i></div>
      <div class="isik" id="i-bekci" title="bekçi ayrı model ailesinden mi" style="--renk:var(--violet)"><i></i></div>
    </div>
  </div>
  <div class="grup"><span>KISAYOL</span>
    <div class="sira">
      <button class="k" id="k-bekleyen">Seni bekleyenler</button>
      <button class="k" id="k-is">Fable'a iş ver</button>
    </div>
  </div>
  <div class="grup"><span>RENK</span><div class="sira" id="renkler"></div></div>
  <div class="durum" id="alt-durum"></div>
</footer>
<div id="modal" role="dialog" aria-modal="true"><div class="ic"><div class="bas"><span id="m-baslik"></span><button class="d koyu" id="m-kapat">Kapat</button></div><pre id="m-metin"></pre></div></div>
<div id="tost"></div>

<script>
(() => {
  'use strict';
  // ---------- dünya ----------
  let W = 1590, H = 1268, OLCU = 1, ICERIK = true;
  // Sağdaki özel bölge: patronun (senin) ofisi.
  const BOLGE = { x0: 1238, y0: 34, x1: 1568, y1: 740 };
  const YERLER = {
    telegram:         { x: 170,  y: 215, ad: 'telegram',            renk: '#8fb7ff' },
    bekci:            { x: 600,  y: 190, ad: 'bekçi',               renk: '#b4bcc6', robot: 3 },
    'youtube-analiz': { x: 1030, y: 215, ad: 'youtube-analiz',      renk: '#ff7a6e', robot: 1 },
    'x-icerik':       { x: 330,  y: 500, ad: 'x-icerik',            renk: '#5fa0ff', robot: 0 },
    dagitici:         { x: 600,  y: 515, ad: 'dağıtıcı',            renk: '#e6b36a' },
    'twitter-icerik': { x: 870,  y: 500, ad: 'twitter-icerik',      renk: '#9bdcf0', robot: 2 },
    patron:           { x: 1403, y: 280, ad: 'mycompany merkez',     renk: '#7cc7ff' },
    masa:             { x: 1403, y: 575, ad: 'yayın masası',        renk: '#f0a63a' },
    fable:            { x: 618,  y: 1168, ad: 'Fable',              renk: '#ff9a6b', salon: true },
  };
  const YOLLAR = [['telegram', 'x-icerik'], ['telegram', 'bekci'], ['bekci', 'youtube-analiz'], ['bekci', 'dagitici'],
                  ['x-icerik', 'dagitici'], ['dagitici', 'twitter-icerik'], ['twitter-icerik', 'masa'],
                  ['youtube-analiz', 'patron'], ['patron', 'masa'], ['fable', 'masa']];
  // Ekip salonu: arka sıra Codex, orta Antigravity, ön Claude; en önde CEO (Fable).
  const SALON = { x0: 30, y0: 780, x1: 1205, y1: 1250 };
  const SIRALAR = [['codex', 905], ['antigravity', 1012], ['claude', 1117]];
  const CEO_MASA = { x: 618, y: 1214 };
  const YEDEK_ROBOT = { claude: 1, antigravity: 0, codex: 3 };
  let MASALAR = {};
  const BINA_DOSYASI = { patron: 'patron-ofisi' };
  // Robot koleksiyonu (8 sütun x 3 satır) varsa bu yerlere süs robotu koyar: hücre sırası.
  const KOLEKSIYON = { dagitici: 7, telegram: 20 };
  const TAKIMLAR = ['x-icerik', 'youtube-analiz', 'twitter-icerik'];
  const ROBOT_YERI = { 'x-icerik': 'x-icerik', 'youtube-analiz': 'youtube-analiz', 'twitter-icerik': 'twitter-icerik', bekci: 'bekci' };
  const dugum = (id) => ({ x: YERLER[id].x, y: YERLER[id].y + 30 });

  // ---------- yardımcılar ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const gorev = (t) => !t ? '' : typeof t === 'string' ? t : [t.id, t.title].filter(Boolean).join(' · ');
  const DURUM_ADI = { running: 'çalışıyor', waiting: 'seni bekliyor', error: 'hata', paused: 'beklemede', idle: 'boşta' };
  const SONUC_ADI = { tamam: 'tamam', red: 'red', hata: 'hata', atlandi: 'atlandı', '?': '?' };
  const SONUC_CIP = { tamam: 'c-running', red: 'c-error', hata: 'c-error', atlandi: 'c-paused', '?': 'c-idle' };
  const sure = (ms) => ms == null ? '…' : ms < 1000 ? `${ms} ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)} sn` : `${Math.round(ms / 60000)} dk`;
  const once = (ms) => { const s = Math.max(0, (Date.now() - ms) / 1000); return s < 60 ? `${Math.round(s)} sn önce` : s < 3600 ? `${Math.round(s / 60)} dk önce` : `${Math.round(s / 3600)} sa önce`; };
  const saklı = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) { return null; } };
  function tost(m) { const t = $('tost'); t.textContent = m; t.style.display = 'block'; clearTimeout(tost.z); tost.z = setTimeout(() => (t.style.display = 'none'), 3200); }

  // ---------- görseller: siyah zemini ayıkla, kırp ----------
  function zeminiAyikla(kaynak, sx, sy, sw, sh) {
    const c = document.createElement('canvas'); c.width = sw; c.height = sh;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(kaynak, sx, sy, sw, sh, 0, 0, sw, sh);
    const im = g.getImageData(0, 0, sw, sh), p = im.data;
    const koyu = (i) => p[i + 3] < 16 || (p[i] + p[i + 1] + p[i + 2]) < 66;
    const gorulen = new Uint8Array(sw * sh), yigin = [];
    for (let x = 0; x < sw; x++) { yigin.push(x, (sh - 1) * sw + x); }
    for (let y = 0; y < sh; y++) { yigin.push(y * sw, y * sw + sw - 1); }
    while (yigin.length) {
      const n = yigin.pop();
      if (gorulen[n]) continue;
      gorulen[n] = 1;
      if (!koyu(n * 4)) continue;
      p[n * 4 + 3] = 0;
      const x = n % sw, y = (n / sw) | 0;
      if (x > 0) yigin.push(n - 1); if (x < sw - 1) yigin.push(n + 1);
      if (y > 0) yigin.push(n - sw); if (y < sh - 1) yigin.push(n + sw);
    }
    let x0 = sw, y0 = sh, x1 = 0, y1 = 0;
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) if (p[(y * sw + x) * 4 + 3] > 20) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    g.putImageData(im, 0, 0);
    if (x1 <= x0) return c;
    const k = document.createElement('canvas'); k.width = x1 - x0 + 1; k.height = y1 - y0 + 1;
    k.getContext('2d').drawImage(c, x0, y0, k.width, k.height, 0, 0, k.width, k.height);
    return k;
  }
  const yukle = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
  const ROBOTLAR = [], BINALAR = {}, NPC = {};
  let PATRON = null, MASA_IMG = null, CEO_IMG = null;
  const KARAKTER = {};
  async function gorselleriYukle(liste) {
    const r = await yukle('/robotlar.png');
    if (r) for (let i = 0; i < 4; i++) ROBOTLAR[i] = zeminiAyikla(r, i * r.width / 4, 0, r.width / 4, Math.round(r.height * 0.72));
    await Promise.all(Object.keys(YERLER).filter((id) => liste.includes(BINA_DOSYASI[id] || id)).map(async (id) => {
      const i = await yukle(`/gorsel/${BINA_DOSYASI[id] || id}.png`);
      if (i) BINALAR[id] = zeminiAyikla(i, 0, 0, i.width, i.height);
    }));
    await Promise.all(Object.keys(MASALAR).filter((id) => liste.includes(id)).map(async (id) => {
      const i = await yukle(`/gorsel/${id}.png`); if (i) KARAKTER[id] = zeminiAyikla(i, 0, 0, i.width, i.height);
    }));
    for (const [ad, ata] of [['calisma-masasi', (v) => (MASA_IMG = v)], ['ceo-masasi', (v) => (CEO_IMG = v)]]) {
      if (liste.includes(ad)) { const i = await yukle(`/gorsel/${ad}.png`); if (i) ata(zeminiAyikla(i, 0, 0, i.width, i.height)); }
    }
    if (liste.includes('patron')) { const i = await yukle('/gorsel/patron.png'); if (i) PATRON = zeminiAyikla(i, 0, 0, i.width, i.height); }
    if (liste.includes('robot-koleksiyonu')) {
      const k = await yukle('/gorsel/robot-koleksiyonu.png');
      if (k) for (const [yer, hucre] of Object.entries(KOLEKSIYON)) {
        const cw = k.width / 8, ch = k.height / 3, sx = (hucre % 8) * cw, sy = Math.floor(hucre / 8) * ch;
        NPC[yer] = zeminiAyikla(k, Math.round(sx), Math.round(sy), Math.round(cw), Math.round(ch * 0.7));
      }
    }
  }

  // ---------- yedek bina: görsel yoksa piksel çizim ----------
  const YEDEK = {};
  function yedekBina(id) {
    if (YEDEK[id]) return YEDEK[id];
    const c = document.createElement('canvas'); c.width = 40; c.height = 44;
    const g = c.getContext('2d'), r = YERLER[id].renk;
    const kule = id === 'bekci' || id === 'telegram' || id === 'patron';
    const kutu = (x, y, w, h, f) => { g.fillStyle = f; g.fillRect(x, y, w, h); };
    if (id === 'masa') {
      kutu(6, 26, 28, 4, '#7a4f28'); kutu(8, 30, 3, 12, '#4e321a'); kutu(29, 30, 3, 12, '#4e321a');
      kutu(12, 19, 10, 7, '#c08a4a'); kutu(12, 21, 10, 1, '#8a5d2c'); kutu(25, 17, 4, 9, '#3a2a16'); kutu(26, 18, 2, 3, '#ffd36b');
    } else if (kule) {
      kutu(13, 8, 14, 34, '#5b5f66'); kutu(11, 4, 18, 6, '#6d727a');
      for (let x = 11; x < 29; x += 4) kutu(x, 1, 2, 3, '#6d727a');
      kutu(18, 14, 4, 5, '#ffcf5a'); kutu(18, 26, 4, 5, '#ffcf5a'); kutu(17, 35, 6, 7, '#2a1c10');
      kutu(13, 8, 2, 34, '#44474d');
    } else {
      kutu(6, 20, 28, 22, '#6b4a2b'); kutu(6, 20, 3, 22, '#55391f');
      for (let i = 0; i < 12; i++) kutu(4 + i, 20 - i, 32 - 2 * i, 2, i % 2 ? r : '#2b2b44');
      kutu(10, 26, 6, 6, '#ffcf5a'); kutu(24, 26, 6, 6, '#ffcf5a'); kutu(17, 32, 6, 10, '#2a1c10');
    }
    return (YEDEK[id] = c);
  }

  // ---------- durum ----------
  let VERI = null, SECILI = saklı('ofis.secili') || null, BAGLI = false;
  const robotlar = {};   // id → {x, y, at, rota:[], hedef, yon}
  const zarflar = [], dumanlar = [], bocekler = [];
  const oncekiKuyruk = {};

  for (const id of Object.keys(YERLER)) for (let i = 0; i < 9; i++) bocekler.push({ id, a: Math.random() * 6.28, r: 0.3 + Math.random() * 0.7, f: 0.5 + Math.random(), z: Math.random() * 6.28 });

  // ---------- yollar ----------
  function kenarNoktalari(a, b) {
    const p = dugum(a), q = dugum(b);
    return [p, { x: q.x, y: p.y }, q];
  }
  function rota(bas, son) {
    if (bas === son) return [];
    const onceki = { [bas]: null }, kuyruk = [bas];
    while (kuyruk.length) {
      const n = kuyruk.shift();
      if (n === son) break;
      for (const [a, b] of YOLLAR) {
        const m = a === n ? b : b === n ? a : null;
        if (m && !(m in onceki)) { onceki[m] = n; kuyruk.push(m); }
      }
    }
    if (!(son in onceki)) return [];
    const zincir = []; for (let n = son; n; n = onceki[n]) zincir.unshift(n);
    const noktalar = [];
    for (let i = 0; i < zincir.length - 1; i++) {
      const a = zincir[i], b = zincir[i + 1];
      const ileri = YOLLAR.some(([x, y]) => x === a && y === b);
      const k = ileri ? kenarNoktalari(a, b) : kenarNoktalari(b, a).reverse();
      noktalar.push(...(i ? k.slice(1) : k));
    }
    return noktalar;
  }

  // ---------- veri → hedefler ----------
  function ajan(id) { return VERI?.ajanlar.find((a) => a.id === id); }
  function slot(id) {
    const a = ajan(id), ev = YERLER[ROBOT_YERI[id]];
    if (!a) return { yer: ROBOT_YERI[id], x: ev.x + 62, y: ev.y + 34 };
    if (id === 'bekci' && a.status === 'running' && YERLER[a.parent]) {
      const y = YERLER[a.parent]; return { yer: a.parent, x: y.x - 66, y: y.y + 36 };
    }
    if (a.status === 'waiting') {
      const sira = VERI.ajanlar.filter((b) => b.status === 'waiting' && ROBOT_YERI[b.id]).findIndex((b) => b.id === id);
      const m = YERLER.masa; return { yer: 'masa', x: m.x - 66 - sira * 46, y: m.y + 46 };
    }
    return { yer: ROBOT_YERI[id], x: ev.x + 62, y: ev.y + 34 };
  }
  function duzeniKur(icerik) {
    ICERIK = icerik;
    if (icerik) return;
    for (const id of ['telegram', 'bekci', 'youtube-analiz', 'x-icerik', 'dagitici', 'twitter-icerik']) delete YERLER[id];
    for (const k of Object.keys(ROBOT_YERI)) delete ROBOT_YERI[k];
    for (const k of Object.keys(robotlar)) delete robotlar[k];
    for (const k of Object.keys(NPC)) delete NPC[k];

        ${!ICERIK ? '' : `<p class="kucuk" style="margin-top:12px">İÇERİK TAKIMLARINA İŞ VER</p>
        <select id="is-takim" style="width:100%;margin-bottom:6px;background:#0d0907;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:6px;font:12px var(--mono)">
          ${TAKIMLAR.map((t) => `<option value="${t}">${t}</option>`).join('')}</select>
        <textarea id="is-metni" placeholder="Ne yapılsın? Seçtiğin takımın kuyruğuna düşer."></textarea>
        <div class="dugmeler"><button class="d yesil" data-e="is-sec">▶ Kuyruğa ekle</button></div>`}</div>`;
    }
    return `<div class="kart"><h3 style="color:${y.renk}">${esc(y.ad)}</h3><p>${metin}</p></div>`;
  }

  function panel() {
    if (!VERI) return;
    const s = VERI.son3saat, n = VERI.ajanlar.filter(bekliyorMu).length, e = VERI.ekip || { ajanlar: [], aileler: {} };
    const kos = VERI.kosular;
    $('panel').innerHTML = `
      ${seciliKart()}
      <h2>Seni bekleyenler <small>${n}</small></h2>
      ${bekleyenler()}
      ${!ICERIK ? '' : `<h2>İçerik takımları</h2>
      <ul class="liste">${VERI.ajanlar.filter((a) => ROBOT_YERI[a.id]).map((a) => `<li class="tik" data-e="sec" data-t="${esc(a.id)}"><span style="color:${YERLER[ROBOT_YERI[a.id]].renk}">●</span><span>${esc(a.name)}</span><span class="cip c-${a.status}">${DURUM_ADI[a.status]}</span></li>`).join('')}</ul>`}
      <h2>Ekip salonu <small>${e.ajanlar.filter((x) => ajan(x.id)?.status === 'running').length} çalışıyor</small></h2>
      <ul class="liste">${['fable', ...e.ajanlar.map((x) => x.id)].map((id) => { const a = ajan(id); if (!a) return ''; const u = e.ajanlar.find((x) => x.id === id); const renk = u ? e.aileler[u.aile].renk : YERLER.fable.renk;
        return `<li class="tik" data-e="sec" data-t="${esc(id)}"><span style="color:${renk}">●</span><span>${esc(a.name)}</span><span class="cip c-${a.status}">${DURUM_ADI[a.status]}</span></li>`; }).join('')}</ul>
      ${!ICERIK ? '' : `<details ${saklı('ofis.kosular') === '0' ? '' : 'open'} id="kosular-ac"><summary>Koşular (${kos.length})</summary>
      ${kos.length ? `<ul class="liste">${kos.slice(0, 15).map((k) => `<li class="tik" data-e="kayit" data-t="${esc(k.takim)}" data-dosya="${esc(k.dosya)}"><span class="kucuk">${esc(k.zaman.slice(5).replace('T', ' '))}</span><span>${esc(k.takim)} <span class="kucuk">${k.maliyet ? '$' + k.maliyet.toFixed(2) : ''}</span></span><span class="cip ${SONUC_CIP[k.sonuc]}">${esc(SONUC_ADI[k.sonuc])}</span></li>`).join('')}</ul>` : '<p class="bos">henüz koşu yok</p>'}
      </details>
      <h2>Ben yokken ne oldu</h2>
      <div class="kart ozet"><p class="kucuk">Son 3 saat</p>
        ${s.kosu ? `<p><b>${s.kosu}</b> koşu · <b>${s.tamam}</b> tamam · <b>${s.red}</b> red · <b>${s.atlandi}</b> atlandı · <b>$${s.usd.toFixed(2)}</b></p>` : '<p class="bos">Sessizdi, koşu olmadı.</p>'}
        <p class="kucuk">Bugün harcanan: $${VERI.para.bugun.toFixed(2)} / $${VERI.para.tavan.toFixed(0)} tavan</p></div>`}`;
    if ($('kosular-ac')) $('kosular-ac').addEventListener('toggle', (e) => saklı('ofis.kosular', e.target.open ? '1' : '0'));
  }

  function ustBilgi() {
    const ad = VERI.sirket || 'mycompany', parca = ad.match(/^(.+?)([A-ZÇĞİÖŞÜ][^A-ZÇĞİÖŞÜ]*)$/) || ad.match(/^(my)(.+)$/i);
    $('ad').innerHTML = parca ? `${esc(parca[1])}<span>${esc(parca[2])}</span>` : `<span>${esc(ad)}</span>`;
    document.title = `${ad} · Ofis`;
    const m = VERI.mesai, p = VERI.para;
    $('ust-meta').textContent = `${VERI.saat} · mesai ${m.icinde ? 'içinde' : 'dışında'} (${m.metin}) · bugün $${p.bugun.toFixed(2)} / $${p.tavan.toFixed(0)}`;
    $('para-bar').style.width = `${Math.min(100, 100 * p.bugun / p.tavan)}%`;
    const ms = $('mesai'); ms.style.display = m.icinde ? 'none' : 'block'; ms.textContent = `mesai dışı · sonraki açılış ${m.sonraki}`;
    $('i-mesai').classList.toggle('on', m.icinde);
    $('i-bekci').classList.toggle('on', /OpenAI/.test(ajan('bekci')?.role || ''));
    const calisan = VERI.ajanlar.filter((a) => a.status === 'running').length;
    $('alt-durum').textContent = `${VERI.ajanlar.length} çalışan · ${calisan} şu an işte · 3 saniyede bir tazelenir`;
  }

  // ---------- döngü ----------
  async function yenile() {
    try {
      const r = await fetch('/api/durum', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      VERI = await r.json(); BAGLI = true;
    } catch (_) { BAGLI = false; }
    $('i-sunucu').classList.toggle('on', BAGLI);
    if (!VERI) { $('ust-meta').textContent = 'ofis sunucusuna ulaşılamadı'; return; }
    masalariKur(); hedefleriGuncelle(); ustBilgi();
    const odak = document.activeElement;
    if (!(odak && ['is-metni', 'is-takim', 'ceo-metni', 'ceo-cwd', 'ceo-yaz'].includes(odak.id))) panel();   // yazarken paneli yeniden çizme
  }
  (async () => {
    await yenile();
    duzeniKur(!VERI || VERI.icerik !== false);
    masalariKur(); panel();
    await gorselleriYukle(VERI ? VERI.gorseller : []);
    boyutla(); requestAnimationFrame(kare);
    setInterval(yenile, 3000);
  })();
})();
</script>
</body>
</html>
